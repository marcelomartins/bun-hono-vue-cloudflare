name: Bug report
description: Something in the starter does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps from a clean checkout. Include the command you ran and the output, with any secrets removed.
      placeholder: |
        1. bun install
        2. bun run dev
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Worker / API
        - Vue client
        - Shared contracts
        - Build, guards or SSG
        - Tests or verify pipeline
        - Bootstrap script (bun run init)
        - Deployment / wrangler
        - Not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `bun --version` and `node --version`, plus your OS.
      placeholder: "bun 1.3.4, node 22.12.0, Windows 11"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran `bun run verify` and included the failure output above if it failed.
          required: true
        - label: I reproduced this on the current `main`, not only on an older copy.
          required: true
